name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Если в репозиторий загружен только chunk-roulette.zip — распаковать его.
      - name: Find project
        id: p
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f chunk-roulette.zip ]; then
            unzip -q -o chunk-roulette.zip -d unpacked
            echo "dir=$(dirname "$(find unpacked -name build.gradle | head -1)")" >> "$GITHUB_OUTPUT"
          else
            echo "Нет ни build.gradle, ни chunk-roulette.zip" && exit 1
          fi

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-roulette-jar
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
